<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LQV · Placa de nota</title>
<!--
PLACA DE NOTA · 1080×1350 (slide interna del carrusel)
Marcadores: Nota 02 (ej. "Nota 01"), MIÉRCOLES, 14/10, ZAMOMO, Eazala María, autora del libro infantil Zamomo, nos cuenta sobre la historia y los personajes del libro.,
            ../fotos/nota-2-zamomo.jpg (URL de la imagen), center 38% (encuadre CSS, ej. "center 30%")
ZAMOMO y Eazala María, autora del libro infantil Zamomo, nos cuenta sobre la historia y los personajes del libro. aparecen dos veces (texto visible + copia de medición): reemplazar todas.
-->
<link rel="stylesheet" href="../../temas/t12/tema.css">
<style>
  /* ─── Base común (no tocar: solo estructura, todo lo visual viene del tema) ─── */
  @property --fit-w { syntax: '<length>'; inherits: true; initial-value: 0px; }
  @property --fit-g { syntax: '<length>'; inherits: true; initial-value: 0px; }

  html, body { margin: 0; padding: 0; background: var(--lqv-bg-edge); }
  body { width: 1080px; height: 1350px; overflow: hidden; }

  .lqv-frame {
    position: relative; overflow: hidden; isolation: isolate;
    width: 1080px; height: 1350px;
    background: var(--fondo);
    color: var(--texto);
    font-family: var(--fuente-texto);
    font-weight: var(--peso-texto);
    font-size: 16px;
  }
  .lqv-frame::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--fondo-halo); }
  .lqv-frame::after {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background-image: var(--fondo-grano); background-size: var(--fondo-grano-tamano);
    mix-blend-mode: var(--fondo-grano-mezcla);
  }
  .lqv-deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; background-repeat: no-repeat; background-position: 0 0; background-size: 100% 100%; }
  .lqv-piso { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; pointer-events: none; background: var(--piso); }
  .lqv-piso::before {
    content: ""; position: absolute; top: 0; left: var(--linea-margen); right: var(--linea-margen);
    height: var(--linea-alto); background: var(--linea); filter: var(--linea-desenfoque); box-shadow: var(--linea-brillo);
  }
  .lqv-logo { position: absolute; z-index: 5; aspect-ratio: 534 / 288; background: var(--logo) no-repeat center / contain; filter: var(--logo-brillo); }
  .lqv-contenido { position: absolute; inset: 0; z-index: 4; }

  /* Foto */
  .foto {
    position: relative; overflow: hidden; box-sizing: border-box;
    width: 100%; height: 100%;
    background: var(--foto-fondo); border: var(--foto-borde); box-shadow: var(--foto-sombra);
    border-radius: var(--foto-radio);
  }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; filter: var(--foto-filtro); }

  /* Día + fecha */
  .fecha {
    font-family: var(--fuente-titulo); font-weight: var(--peso-titulo); text-transform: var(--mayusculas-titulo);
    color: var(--texto); line-height: 1; white-space: nowrap;
    --fit-ls: .14em; --fit-sombra: var(--brillo-blanco);
  }
  .fecha b { font-weight: inherit; color: var(--acento-fecha); text-shadow: var(--brillo-fecha); }

  /* Botón Spotify (--s = tamaño) */
  .spotify {
    display: inline-flex; align-items: center; gap: calc(var(--s) * .32);
    padding: calc(var(--s) * .22) calc(var(--s) * .5);
    font-family: var(--fuente-titulo); font-weight: var(--peso-titulo); letter-spacing: .08em; color: var(--boton-texto);
    border: var(--boton-borde); border-radius: calc(var(--s) * var(--boton-radio));
    background: var(--boton-fondo); box-shadow: var(--boton-sombra); backdrop-filter: var(--boton-desenfoque);
  }
  .spotify-etq { font-size: calc(var(--s) * .52); font-family: var(--fuente-mono); font-weight: var(--peso-mono); text-transform: uppercase; letter-spacing: .2em; opacity: var(--boton-etiqueta-opacidad); }
  .spotify-ico { display: block; flex: none; width: calc(var(--s) * 1.25); height: calc(var(--s) * 1.25); background: var(--spotify-icono) no-repeat center / contain; filter: var(--spotify-brillo); }
  .spotify-txt { font-size: calc(var(--s) * 1.1); line-height: 1; letter-spacing: .04em; text-shadow: var(--boton-texto-brillo); text-transform: var(--mayusculas-titulo); }

  /* Ajuste automático de tamaño de texto (sin JavaScript).
     Una copia invisible mide el ancho del texto en una sola línea; con eso se
     calcula el tamaño más grande que entra en el ancho y en las líneas
     disponibles (--fit-base = tamaño ideal, --fit-h = alto máximo). */
  .fit { container-type: inline-size; }
  .fit-fila { display: flex; align-items: flex-start; width: 10000px; --fit-w: 100cqi; }
  .fit-hueco { flex: 1 1 0; min-width: 0; container-type: inline-size; }
  .fit-txt, .fit-medida { letter-spacing: var(--fit-ls, normal); text-shadow: var(--fit-sombra, none); }
  .fit-medida { flex: none; white-space: nowrap; visibility: hidden; height: 0; overflow: hidden; font-size: var(--fit-base); }
  .fit-txt { display: block; width: var(--fit-w); --fit-g: 100cqi; --fit-r: tan(atan2(var(--fit-w), 10000px - var(--fit-g))); }
  .fit-1 .fit-txt { white-space: nowrap; font-size: min(var(--fit-base), var(--fit-base) * var(--fit-r) * .99); }

  /* ─── Diseño de esta pieza (solo posiciones y tamaños) ─── */
  .lqv-deco { background-image: var(--deco-placa); }
  .lqv-piso { height: 18%; }
  .lqv-logo { top: 48px; left: 64px; width: 237.6px; }

  /* Márgenes seguros IG: 64px a los costados, 48px arriba/abajo. Nada se apoya bajo el logo. */
  .marco-foto { position: absolute; top: 200px; left: 64px; right: 64px; height: 540px; }
  .marco-foto .foto { border-radius: var(--foto-radio-placa); }

  .barra { position: absolute; top: 48px; height: 128px; left: 330px; right: 64px; z-index: 5;
    display: flex; align-items: center; justify-content: flex-end; gap: 20px; }
  .chip { padding: 8px 14px; border-radius: var(--chip-radio); background: var(--chip-fondo); border: var(--chip-borde);
    backdrop-filter: var(--chip-desenfoque); font-family: var(--fuente-mono); font-weight: var(--peso-mono);
    font-size: 22px; letter-spacing: .25em; text-transform: uppercase; white-space: nowrap;
    color: var(--acento-etiqueta); text-shadow: var(--brillo-chip); }
  .barra .fecha { font-size: 32px; letter-spacing: .14em; text-shadow: var(--brillo-blanco); }

  .textos { position: absolute; top: 764px; left: 64px; right: 64px; display: flex; flex-direction: column; gap: 14px; }
  .titulo { font-family: var(--fuente-titulo); font-weight: var(--peso-titulo); text-transform: var(--mayusculas-titulo);
    color: var(--texto); line-height: 1.18; text-wrap: balance;
    --fit-base: 108px; --fit-lh: 1.18; --fit-h: 255px; --fit-ls: .005em; --fit-sombra: var(--brillo-titulo); }
  .descripcion { width: 95%; font-family: var(--fuente-texto); font-weight: var(--peso-texto);
    color: var(--texto-descripcion); line-height: 1.18; text-wrap: pretty;
    --fit-base: 36px; --fit-lh: 1.18; --fit-h: 170px; --fit-sombra: var(--brillo-descripcion); }
  .titulo .fit-txt { font-size: max(
    min(var(--fit-base), var(--fit-h) / var(--fit-lh), var(--fit-base) * var(--fit-r) * .99),
    min(var(--fit-base), var(--fit-h) / (2 * var(--fit-lh)), 2 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (3 * var(--fit-lh)), 3 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (4 * var(--fit-lh)), 4 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (5 * var(--fit-lh)), 5 * var(--fit-base) * var(--fit-r) / 1.18)
  ); }
  .descripcion .fit-txt { font-size: max(
    min(var(--fit-base), var(--fit-h) / var(--fit-lh), var(--fit-base) * var(--fit-r) * .99),
    min(var(--fit-base), var(--fit-h) / (2 * var(--fit-lh)), 2 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (3 * var(--fit-lh)), 3 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (4 * var(--fit-lh)), 4 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (5 * var(--fit-lh)), 5 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (6 * var(--fit-lh)), 6 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (7 * var(--fit-lh)), 7 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (8 * var(--fit-lh)), 8 * var(--fit-base) * var(--fit-r) / 1.18),
    min(var(--fit-base), var(--fit-h) / (9 * var(--fit-lh)), 9 * var(--fit-base) * var(--fit-r) / 1.18)
  ); }

  .boton { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; }
  .boton .spotify { --s: 46px; }
</style>
</head>
<body>
<div class="lqv-frame">
  <div class="lqv-deco"></div>
  <div class="lqv-piso"></div>
  <div class="lqv-logo"></div>
  <div class="lqv-contenido">
    <div class="marco-foto"><div class="foto"><img src="../fotos/nota-2-zamomo.jpg" alt="" style="object-position: center 38%"></div></div>
    <div class="barra">
      <div class="chip">Nota 02</div>
      <div class="fecha">MIÉRCOLES <b>14/10</b></div>
    </div>
    <div class="textos">
      <div class="titulo fit fit-n"><div class="fit-fila"><div class="fit-hueco"><span class="fit-txt">ZAMOMO</span></div><span class="fit-medida" aria-hidden="true">ZAMOMO</span></div></div>
      <div class="descripcion fit fit-n"><div class="fit-fila"><div class="fit-hueco"><span class="fit-txt">Eazala María, autora del libro infantil Zamomo, nos cuenta sobre la historia y los personajes del libro.</span></div><span class="fit-medida" aria-hidden="true">Eazala María, autora del libro infantil Zamomo, nos cuenta sobre la historia y los personajes del libro.</span></div></div>
    </div>
    <div class="boton"><div class="spotify"><span class="spotify-etq">escuchanos en</span><span class="spotify-ico"></span><span class="spotify-txt">Spotify</span></div></div>
  </div>
</div>
</body>
</html>
