<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Traeme La Carta · Carrusel: lámina</title>
<!--
CARRUSEL · LÁMINA · 1080×1350 (láminas intermedias: tips o pasos)
Fondo claro del sitio con puntos, número grande en verde, título y texto. Con imagen, la foto va arriba en una
tarjeta redondeada; sin imagen, la lámina es solo texto sobre el fondo de marca y todo se agranda.

Marcadores: {{numero}} ("02"), {{titulo}}, {{texto}} (hasta 5 líneas), {{imagen}} (opcional: URL o data URL),
            {{imagen_pos}} (encuadre CSS: "center 30%").
- {{titulo}} y {{texto}} aparecen dos veces cada uno (texto visible + copia invisible para medir): reemplazar todas.
- Todos los marcadores tienen que recibir un valor. Sin imagen, pasar imagen "" (imagen_pos puede ir vacío también).
- Los valores van escapados para HTML (& → &amp;, < → &lt;, " → &quot;).
- El elemento raíz de 1080×1350 tiene data-marco: el servidor recorta por ahí.
- Título: hasta 3 líneas, de 76 px (96 px sin imagen) a 50 px como mínimo; si no entra, corta con "…".
  Texto: hasta 5 líneas, de 36 px (40 px sin imagen) a 28 px. Sin precios. Sin JavaScript; requiere Chromium 120 o posterior.
Guía de marca: ../marca.md
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=block">
<style>
  /* ─── Paleta y fuentes (traemelacarta/marca.md) ─── */
  :root {
    --verde: #2ecc71; --verde-osc: #1fa85a; --verde-suave: #e9f9f0;
    --ink: #0e1f17; --dark: #13221a; --text: #3d4a43; --bg-alt: #f5f8f6;
    --display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
    --texto: "Inter", system-ui, sans-serif;
  }

  /* ─── Ajuste automático de tamaño de texto (mismo mecanismo que super/plantillas) ─── */
  @property --fit-w { syntax: '<length>'; inherits: true; initial-value: 0px; }
  @property --fit-g { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .fit { container-type: inline-size; }
  .fit-fila { display: flex; align-items: flex-start; width: 10000px; --fit-w: 100cqi; }
  .fit-hueco { flex: 1 1 0; min-width: 0; container-type: inline-size; }
  .fit-txt, .fit-medida { letter-spacing: var(--fit-ls, normal); }
  .fit-medida { flex: none; white-space: nowrap; visibility: hidden; height: 0; overflow: hidden; font-size: var(--fit-base); }
  .fit-txt { width: var(--fit-w); --fit-g: 100cqi; --fit-r: tan(atan2(var(--fit-w), 10000px - var(--fit-g))); }

  /* ─── Base ─── */
  html, body { margin: 0; padding: 0; background: var(--bg-alt); }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .pieza { position: relative; overflow: hidden; width: 1080px; height: 1350px; display: flex; flex-direction: column;
    font-family: var(--texto); color: var(--ink);
    background:
      radial-gradient(rgba(14,31,23,.08) 1.6px, transparent 1.8px) 0 0 / 30px 30px,
      radial-gradient(800px 600px at 100% 0%, var(--verde-suave) 0%, transparent 70%),
      var(--bg-alt); }

  /* Foto en tarjeta redondeada (si viene): ocupa todo el lugar que deja el texto */
  .foto { flex: 1 1 0; min-height: 360px; position: relative; margin: 56px 64px 0; border-radius: 36px; overflow: hidden;
    background: var(--dark); box-shadow: 0 26px 50px -26px rgba(16,40,28,.5); }
  .foto img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; }
  .pieza:has(.foto img[src=""]) .foto { display: none; }

  .contenido { flex: none; padding: 44px 64px 42px; display: flex; flex-direction: column; justify-content: center; gap: 22px; }

  /* Número: grande, en verde, con una raya */
  .numero { display: flex; align-items: center; gap: 26px; font-family: var(--display); font-weight: 800; font-size: 100px;
    line-height: .9; letter-spacing: -.04em; color: var(--verde); }
  .numero::after { content: ""; flex: none; width: 110px; height: 10px; border-radius: 5px; background: var(--verde); }

  /* Título: hasta 3 líneas */
  .titulo { font-family: var(--display); font-weight: 800; line-height: 1.06; text-wrap: balance; color: var(--ink);
    --fit-base: 76px; --fit-min: 50px; --fit-lh: 1.06; --fit-h: 242px; --fit-ls: -.03em; }
  .titulo .fit-txt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    padding-bottom: .14em; margin-bottom: -.14em;
    font-size: max(var(--fit-min), max(
      min(var(--fit-base), var(--fit-h) / var(--fit-lh), var(--fit-base) * var(--fit-r) * .99),
      min(var(--fit-base), var(--fit-h) / (2 * var(--fit-lh)), 2 * var(--fit-base) * var(--fit-r) / 1.3),
      min(var(--fit-base), var(--fit-h) / (3 * var(--fit-lh)), 3 * var(--fit-base) * var(--fit-r) / 1.4)
    )); }

  /* Texto: hasta 5 líneas */
  .texto { font-weight: 500; color: var(--text); line-height: 1.4; text-wrap: pretty;
    --fit-base: 36px; --fit-min: 28px; --fit-lh: 1.4; --fit-h: 252px; }
  .texto .fit-txt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden;
    font-size: max(var(--fit-min), max(
      min(var(--fit-base), var(--fit-h) / var(--fit-lh), var(--fit-base) * var(--fit-r) * .99),
      min(var(--fit-base), var(--fit-h) / (2 * var(--fit-lh)), 2 * var(--fit-base) * var(--fit-r) / 1.2),
      min(var(--fit-base), var(--fit-h) / (3 * var(--fit-lh)), 3 * var(--fit-base) * var(--fit-r) / 1.25),
      min(var(--fit-base), var(--fit-h) / (4 * var(--fit-lh)), 4 * var(--fit-base) * var(--fit-r) / 1.28),
      min(var(--fit-base), var(--fit-h) / (5 * var(--fit-lh)), 5 * var(--fit-base) * var(--fit-r) / 1.3)
    )); }

  /* Sin imagen: solo texto sobre el fondo de marca, más grande */
  .pieza:has(.foto img[src=""]) .contenido { flex: 1 1 0; padding-top: 60px; gap: 30px; }
  .pieza:has(.foto img[src=""]) .numero { font-size: 200px; }
  .pieza:has(.foto img[src=""]) .numero::after { width: 160px; height: 14px; border-radius: 7px; }
  .pieza:has(.foto img[src=""]) .titulo { --fit-base: 96px; --fit-h: 306px; }
  .pieza:has(.foto img[src=""]) .texto { --fit-base: 40px; --fit-h: 280px; }

  /* Pie: logo horizontal (nombre oscuro y mano verde, para fondo claro) + dominio */
  .pie { flex: none; height: 150px; margin: 0 64px; display: flex; align-items: center; justify-content: space-between; gap: 32px;
    border-top: 2px solid rgba(14,31,23,.1); }
  .logo-pie { flex: none; height: 88px; aspect-ratio: 973.4 / 266.14;
    background: url("../logos/logo-traemelacarta-horizontal.svg") no-repeat center / contain; }
  .dominio { font-weight: 700; font-size: 34px; color: var(--ink); white-space: nowrap; }
  .dominio b { font-weight: 700; color: var(--verde-osc); }
</style>
</head>
<body>
<div class="pieza" data-marco>
  <div class="foto"><img src="{{imagen}}" alt="" style="object-position: {{imagen_pos}}"></div>
  <div class="contenido">
    <div class="numero">{{numero}}</div>
    <div class="titulo fit"><div class="fit-fila"><div class="fit-hueco"><span class="fit-txt">{{titulo}}</span></div><span class="fit-medida" aria-hidden="true">{{titulo}}</span></div></div>
    <div class="texto fit"><div class="fit-fila"><div class="fit-hueco"><span class="fit-txt">{{texto}}</span></div><span class="fit-medida" aria-hidden="true">{{texto}}</span></div></div>
  </div>
  <div class="pie">
    <div class="logo-pie" role="img" aria-label="Traeme La Carta"></div>
    <div class="dominio">traemelacarta<b>.online</b></div>
  </div>
</div>
</body>
</html>
