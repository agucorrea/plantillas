<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Super 107.5 · Placa de nota</title>
<!--
PLACA DE NOTA · 1080×1350 (para publicar en redes las notas de super1075.com)
Diseño "Sticker": foto con corte en diagonal y título en un bloque con el estilo sticker del logo.

Marcadores: {{titulo}}, {{imagen}} (URL o data URL de la imagen destacada),
            {{categoria}} (opcional: "Música", "Rosario", "En vivo"…).
- {{titulo}} aparece dos veces (texto visible + copia invisible para medir) y {{categoria}} dos veces
  (texto + atributo data-cat): reemplazar todas.
- Todos los marcadores tienen que recibir un valor. Sin categoría, pasar una cadena vacía (""):
  la etiqueta se oculta sola.
- La categoría "En vivo" (o "Al aire") se pinta de naranja, como pide la guía; el resto, en azul.
- Los valores van escapados para HTML (& → &amp;, < → &lt;, " → &quot;), igual que en lqv/.
- El elemento raíz de 1080×1350 tiene data-marco (el servidor recorta por ahí) y la clase .lqv-frame
  (la que captura lqv/herramientas/render.js).
- Título: Archivo ExtraBold, de 104 px a 56 px como mínimo, hasta 4 líneas. Si no entra, corta con "…".
  Sin JavaScript; requiere Chromium 120 o posterior.
Guía de marca: ../marca.md
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,800;0,900;1,800;1,900&family=Inter:wght@700;800&display=block">
<style>
  /* ─── Colores de la marca (super/marca.md) ─── */
  :root {
    --azul: #0383f2; --azul-medio: #2f6fd6; --azul-profundo: #1d3f8f;
    --naranja: #ff6600;              /* solo "En vivo" / "Al aire" */
    --negro: #030404;                /* contorno del logo */
    --tinta: #0b0b0f;
    --hueso: #f1f1f0;                /* letras y borde del logo */
    --display: "Archivo", "Arial Black", sans-serif;
    --texto: "Inter", system-ui, sans-serif;
  }

  /* ─── Ajuste automático de tamaño de texto (mismo mecanismo que lqv/plantillas) ─── */
  @property --fit-w { syntax: '<length>'; inherits: true; initial-value: 0px; }
  @property --fit-g { syntax: '<length>'; inherits: true; initial-value: 0px; }
  .fit { container-type: inline-size; }
  .fit-fila { display: flex; align-items: flex-start; width: 10000px; --fit-w: 100cqi; }
  .fit-hueco { flex: 1 1 0; min-width: 0; container-type: inline-size; }
  .fit-txt, .fit-medida { letter-spacing: var(--fit-ls, normal); }
  .fit-medida { flex: none; white-space: nowrap; visibility: hidden; height: 0; overflow: hidden; font-size: var(--fit-base); }
  .fit-txt { width: var(--fit-w); --fit-g: 100cqi; --fit-r: tan(atan2(var(--fit-w), 10000px - var(--fit-g))); }

  /* ─── Base ─── */
  html, body { margin: 0; padding: 0; background: var(--tinta); }
  body { width: 1080px; height: 1350px; overflow: hidden; }
  .lqv-frame { position: relative; overflow: hidden; width: 1080px; height: 1350px; color: var(--tinta); font-family: var(--texto);
    background: linear-gradient(135deg, var(--azul) 0%, var(--azul-medio) 55%, var(--azul-profundo) 100%); }

  /* Rayos diagonales de fondo */
  .rayos { position: absolute; inset: 0;
    background: repeating-linear-gradient(-28deg, rgba(255,255,255,.07) 0 60px, transparent 60px 140px); }

  /* Foto con corte en diagonal y borde sticker (negro + claro) */
  .foto-borde-claro, .foto-borde-negro, .foto { position: absolute; left: 0; right: 0; top: 0; }
  .foto-borde-claro { height: 836px; background: var(--hueso); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .foto-borde-negro { height: 818px; background: var(--negro); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .foto { height: 800px; background: var(--tinta); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%); }
  .foto img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }

  .logo { position: absolute; top: 48px; left: 64px; width: 230px; aspect-ratio: 233.2 / 160.73;
    background: url("../logos/logo-super-vertical.svg") no-repeat center / contain;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,.35)); }

  /* Bloque sticker del título: relleno claro, contorno negro grueso, borde claro y sombra dura */
  .sticker { position: absolute; left: 60px; right: 60px; bottom: 164px; transform: rotate(-1.6deg);
    background: var(--hueso); border: 10px solid var(--negro); border-radius: 30px;
    box-shadow: 0 0 0 10px var(--hueso), 14px 16px 0 10px var(--negro);
    padding: 40px 36px 38px; }
  .titulo { font-family: var(--display); font-weight: 800; color: var(--tinta); line-height: 1.04; text-wrap: balance;
    --fit-base: 104px; --fit-min: 56px; --fit-lh: 1.04; --fit-h: 440px; --fit-ls: -.015em; }
  .titulo .fit-txt { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
    font-size: max(var(--fit-min), max(
      min(var(--fit-base), var(--fit-h) / var(--fit-lh), var(--fit-base) * var(--fit-r) * .99),
      min(var(--fit-base), var(--fit-h) / (2 * var(--fit-lh)), 2 * var(--fit-base) * var(--fit-r) / 1.3),
      min(var(--fit-base), var(--fit-h) / (3 * var(--fit-lh)), 3 * var(--fit-base) * var(--fit-r) / 1.4),
      min(var(--fit-base), var(--fit-h) / (4 * var(--fit-lh)), 4 * var(--fit-base) * var(--fit-r) / 1.5)
    )); }

  /* Etiqueta de categoría, también sticker, montada sobre el borde del bloque */
  .categoria { position: absolute; left: 34px; top: -44px; transform: rotate(-3deg);
    display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-radius: 999px;
    background: var(--azul); color: #fff; border: 7px solid var(--negro); box-shadow: 0 0 0 7px var(--hueso);
    font-family: var(--texto); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .categoria:empty, .categoria[data-cat=""] { display: none; }
  .categoria[data-cat="en vivo" i], .categoria[data-cat="al aire" i] { background: var(--naranja); }
  .categoria[data-cat="en vivo" i]::before, .categoria[data-cat="al aire" i]::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: #fff; }

  /* Pie: barras de audio + play + dominio */
  .pie { position: absolute; left: 64px; right: 64px; bottom: 48px; height: 72px; display: flex; align-items: center; gap: 22px; }
  .barras { display: flex; align-items: center; gap: 9px; height: 72px; flex: 1; }
  .barras i { display: block; width: 12px; border-radius: 6px; background: rgba(255,255,255,.85); }
  .play { width: 68px; height: 68px; border-radius: 50%; background: var(--hueso); border: 6px solid var(--negro); box-sizing: border-box;
    display: grid; place-items: center; flex: none; }
  .play::before { content: ""; margin-left: 6px; border-style: solid; border-width: 13px 0 13px 21px; border-color: transparent transparent transparent var(--azul); }
  .dominio { font-family: var(--display); font-weight: 900; font-style: italic; font-size: 34px; color: #fff; letter-spacing: .01em; flex: none;
    text-shadow: 3px 3px 0 var(--negro); }
</style>
</head>
<body>
<div class="lqv-frame" data-marco>
  <div class="rayos"></div>
  <div class="foto-borde-claro"></div>
  <div class="foto-borde-negro"></div>
  <div class="foto"><img src="{{imagen}}" alt=""></div>
  <div class="logo"></div>
  <div class="sticker">
    <div class="categoria" data-cat="{{categoria}}">{{categoria}}</div>
    <div class="titulo fit fit-n"><div class="fit-fila"><div class="fit-hueco"><span class="fit-txt">{{titulo}}</span></div><span class="fit-medida" aria-hidden="true">{{titulo}}</span></div></div>
  </div>
  <div class="pie">
    <div class="barras"><i style="height:22%"></i><i style="height:55%"></i><i style="height:85%"></i><i style="height:40%"></i><i style="height:100%"></i><i style="height:65%"></i><i style="height:30%"></i><i style="height:75%"></i><i style="height:50%"></i><i style="height:90%"></i><i style="height:35%"></i><i style="height:60%"></i><i style="height:25%"></i><i style="height:80%"></i><i style="height:45%"></i><i style="height:70%"></i><i style="height:28%"></i><i style="height:52%"></i><i style="height:20%"></i></div>
    <div class="play"></div>
    <div class="dominio">super1075.com</div>
  </div>
</div>
</body>
</html>
